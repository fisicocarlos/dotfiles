# Font configuration
font_family IosevkaTerm Nerd Font
bold_font        auto
italic_font      auto
bold_italic_font auto

font_size        10
disable_ligatures always

# Window configuration
remember_window_size no
remember_window_position no
initial_window_width  90c
initial_window_height 25c

# Window padding
window_padding_width 2

# Cursor colors
cursor            #d4d4d4
cursor_text_color #d4d4d4

# Color scheme (VS Code Dark+ theme)
foreground #d4d4d4
background #1e1e1e

# Normal colors
color0  #1e1e1e
color1  #f44747
color2  #608b4e
color3  #dcdcaa
color4  #569cd6
color5  #c678dd
color6  #56b6c2
color7  #d4d4d4

# Bright colors
color8  #1e1e1e
color9  #f44747
color10 #608b4e
color11 #dcdcaa
color12 #569cd6
color13 #c678dd
color14 #56b6c2
color15 #d4d4d4

enable_audio_bell no
url_color #61afef
url_style curly

shell zsh

#tab_bar_style slant
tab_bar_style powerline
tab_title_template "{fmt.fg.red}{bell_symbol}{activity_symbol}{fmt.fg.tab}{tab.last_focused_progress_percent}{title.rpartition(:')[2]}"

# move around windows (shifts)
map alt+shift+enter new_window
map alt+shift+q close_window
map alt+shift+h neighboring_window left
map alt+shift+l neighboring_window right
map alt+shift+k neighboring_window up
map alt+shift+j neighboring_window down

map alt+shift+w move_window up
map alt+shift+s move_window down
map alt+shift+a move_window left
map alt+shift+d move_window right

# move around tabs (alt)
map alt+ctrl+enter new_tab
map alt+ctrl+q close_tab
map alt+ctrl+space set_tab_title
map alt+ctrl+j next_tab
map alt+ctrl+k previous_tab
map alt+ctrl+l move_tab_forward
map alt+ctrl+h move_tab_backward

