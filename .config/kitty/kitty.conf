# Font configuration
font_family IosevkaTerm Nerd Font
bold_font        auto
italic_font      auto
bold_italic_font auto

font_size        10
disable_ligatures always

# Window configuration
remember_window_size no
remember_window_position no
initial_window_width  90c
initial_window_height 25c

# Window padding
window_padding_width 2

# Cursor colors
cursor            #d4d4d4
cursor_text_color #d4d4d4

# Color scheme (VS Code Dark+ theme)
foreground #d4d4d4
background #1e1e1e

# Normal colors
color0  #1e1e1e
color1  #f44747
color2  #608b4e
color3  #dcdcaa
color4  #569cd6
color5  #c678dd
color6  #56b6c2
color7  #d4d4d4

# Bright colors
color8  #1e1e1e
color9  #f44747
color10 #608b4e
color11 #dcdcaa
color12 #569cd6
color13 #c678dd
color14 #56b6c2
color15 #d4d4d4

enable_audio_bell no
url_color #61afef
url_style curly

shell zsh

#tab_bar_style slant
tab_bar_style powerline
tab_title_template "{fmt.fg.red}{bell_symbol}{activity_symbol}{fmt.fg.tab}{tab.last_focused_progress_percent}{title.rpartition(':')[2]}"

# move around tabs (alt)
map ctrl+shift+enter new_tab
map ctrl+shift+q close_tab
map ctrl+shift+space set_tab_title
map ctrl+shift+j next_tab
map ctrl+shift+k previous_tab
lap ctrl+shift+l move_tab_forward
map ctrl+shift+h move_tab_backward

# move around windows (shifts)
map ctrl+alt+enter new_window
map ctrl+alt+q close_window
map ctrl+alt+h neighboring_window left
map ctrl+alt+l neighboring_window right
map ctrl+alt+k neighboring_window up
map ctrl+alt+j neighboring_window down


